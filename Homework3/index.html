<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff4ee">
  <title>noodle doodle</title>
  <!-- 글꼴은 Pretendard -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <!-- 원·그릇·면·젓가락·양념 전부 이 캔버스 안에서 손으로 조작한다 -->
    <canvas id="stage"></canvas>

    <div id="toast"><span></span><button hidden>되돌리기</button></div>

    <div id="sheet" class="sheet">
      <section class="panel" data-view="form">
        <h2 id="form-title">새로운 가닥</h2>
        <p class="label">제목 <small id="f-count">0/15</small></p>
        <input id="f-title" class="big" placeholder="할 일 (최대 15자)">
        <textarea id="f-memo" placeholder="메모를 적어두세요"></textarea>
        <p class="label">종류 <small>굵을수록 중요한 일이에요</small></p>
        <div class="chips" id="f-types"></div>
        <div class="row">
          <button class="ghost" data-close>취소</button>
          <button class="main" id="f-save">저장</button>
        </div>
      </section>

      <section class="panel" data-view="detail">
        <p id="d-meta" class="meta"></p>
        <h2 id="d-title" class="dt"></h2>
        <p id="d-memo" class="memo"></p>
        <div class="row">
          <button class="link" id="d-del">버리기</button>
          <button class="ghost" id="d-edit">수정</button>
          <button class="main" data-close>닫기</button>
        </div>
      </section>

      <section class="panel" data-view="newcat">
        <h2>새 양념</h2>
        <input id="nc-name" class="big" maxlength="4" placeholder="양념 이름 (최대 4자)">
        <p class="label">색</p>
        <div class="dots" id="nc-colors"></div>
        <div class="row"><button class="ghost" data-close>취소</button><button class="main" id="nc-add">추가</button></div>
      </section>

      <section class="panel" data-view="cats">
        <h2>양념 수정</h2>
        <div id="m-list"></div>
        <div class="row"><button class="main" id="m-done">완료</button></div>
      </section>

      <section class="panel" data-view="guide">
        <h2>도움말</h2>
        <ul class="guide">
          <li><em>면 터치</em><span>메모 보기 · 수정</span></li>
          <li><em>그릇 터치</em><span>새로운 가닥 추가</span></li>
          <li><em>숫자 터치</em><span>목표 변경</span></li>
          <li><em>위로 스와이프</em><span>후루룩 (완료)</span></li>
          <li><em>옆으로 스와이프</em><span>자르기 (삭제)</span></li>
          <li><em>양념 드래그</em><span>면에 색 입히기</span></li>
          <li><em>양념 터치</em><span>수정 · 삭제</span></li>
          <li><em>빈 양념통 터치</em><span>새 양념 추가</span></li>
          <li><em>영수증 당기기</em><span>지난 기록 보기</span></li>
        </ul>
        <div class="row"><button class="main" data-close>닫기</button></div>
      </section>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
