<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff4ee">
  <title>noodle doodle</title>
  <!-- 한글은 Pretendard, 큰 숫자는 Anton -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <!-- 원·그릇·면·젓가락·양념 전부 이 캔버스 안에서 손으로 조작한다 -->
    <canvas id="stage"></canvas>

    <!-- 따라 해보기: 상단 카드가 지금 할 동작을 알려준다 -->
    <aside id="coach" hidden>
      <b id="co-n"></b>
      <p><strong id="co-t"></strong><span id="co-d"></span></p>
      <button id="co-end">그만</button>
    </aside>

    <div id="toast"><span></span><button hidden>되돌리기</button></div>

    <div id="sheet" class="sheet">
      <section class="panel" data-view="form">
        <h2 id="form-title">새로운 가닥</h2>
        <p class="label">제목 <small id="f-count">0/12</small></p>
        <input id="f-title" class="big" maxlength="12" placeholder="할 일 (최대 12자)">
        <textarea id="f-memo" placeholder="메모를 적어두세요"></textarea>
        <p class="label">종류</p>
        <div class="chips" id="f-types"></div>
        <p class="label">길이</p>
        <div class="chips" id="f-sizes"></div>
        <p class="label">양념 <button class="link" id="f-cats-edit">양념 수정</button></p>
        <div class="chips wrap" id="f-cats"></div>
        <div class="row">
          <button class="ghost" data-close>취소</button>
          <button class="main" id="f-save">저장</button>
        </div>
      </section>

      <section class="panel" data-view="detail">
        <p id="d-meta" class="meta"></p>
        <h2 id="d-title" class="dt"></h2>
        <p id="d-memo" class="memo"></p>
        <div class="row">
          <button class="link" id="d-del">버리기</button>
          <button class="ghost" id="d-edit">수정</button>
          <button class="main" data-close>닫기</button>
        </div>
      </section>

      <section class="panel" data-view="cats">
        <h2>양념 수정</h2>
        <p class="meta">색을 누르면 바뀌고, 이름은 바로 고칠 수 있어요</p>
        <div id="m-list"></div>
        <button class="add" id="m-add">+ 양념 추가</button>
        <div class="row"><button class="main" id="m-done">완료</button></div>
      </section>

      <section class="panel" data-view="guide">
        <h2>도움말</h2>
        <ul class="guide" id="guide-list">
          <li data-s="0"><em>면 터치</em><span>메모 읽기 · 수정</span></li>
          <li data-s="1"><em>그릇 터치</em><span>새로운 가닥 추가</span></li>
          <li data-s="2"><em>숫자 터치</em><span>하루 목표 변경</span></li>
          <li data-s="3"><em>위로 스와이프</em><span>후루룩 (완료)</span></li>
          <li data-s="4"><em>옆으로 스와이프</em><span>자르기 (삭제)</span></li>
          <li data-s="5"><em>두 손가락 집기</em><span>한입에 여러 개</span></li>
          <li data-s="6"><em>양념 끌어놓기</em><span>면에 색 입히기</span></li>
          <li data-s="7"><em>영수증 당기기</em><span>지난 기록 보기</span></li>
        </ul>
        <div class="row"><button class="main" data-close>닫기</button></div>
      </section>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
